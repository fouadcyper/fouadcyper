<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Fouad Zulof</title>
  <desc id="desc">Local AI, Linux, and developer tools</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d16" />
      <stop offset="0.55" stop-color="#0b1220" />
      <stop offset="1" stop-color="#101225" />
    </linearGradient>
    <radialGradient id="cyan" cx="0" cy="0" r="1" gradientTransform="translate(840 48) rotate(120) scale(430 330)">
      <stop stop-color="#22d3ee" stop-opacity=".22" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violet" cx="0" cy="0" r="1" gradientTransform="translate(1110 275) rotate(-145) scale(390 260)">
      <stop stop-color="#a78bfa" stop-opacity=".22" />
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity=".35" />
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)" />
  <rect width="1200" height="320" rx="24" fill="url(#cyan)" />
  <rect width="1200" height="320" rx="24" fill="url(#violet)" />
  <rect width="1200" height="320" rx="24" fill="url(#grid)" />
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#ffffff" stroke-opacity=".08" />

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">
    <rect x="70" y="61" width="52" height="5" rx="2.5" fill="url(#accent)" />
    <text x="70" y="132" fill="#f8fafc" font-size="56" font-weight="750" letter-spacing="1">FOUAD ZULOF</text>
    <text x="73" y="174" fill="#b9c3d6" font-size="21" font-weight="450" letter-spacing=".8">LOCAL AI · LINUX · DEVELOPER TOOLS</text>

    <g transform="translate(70 215)" font-size="13" font-weight="600" letter-spacing=".6">
      <rect width="126" height="34" rx="17" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".28" />
      <circle cx="18" cy="17" r="4" fill="#22d3ee" />
      <text x="31" y="22" fill="#a5f3fc">LOCAL-FIRST</text>

      <g transform="translate(138)">
        <rect width="120" height="34" rx="17" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".28" />
        <circle cx="18" cy="17" r="4" fill="#a78bfa" />
        <text x="31" y="22" fill="#ddd6fe">OPEN SOURCE</text>
      </g>
    </g>
  </g>

  <g transform="translate(820 50)" filter="url(#shadow)">
    <rect width="310" height="220" rx="18" fill="#090d16" fill-opacity=".78" stroke="#ffffff" stroke-opacity=".12" />
    <path d="M0 48H310" stroke="#ffffff" stroke-opacity=".09" />
    <circle cx="25" cy="24" r="5" fill="#fb7185" />
    <circle cx="44" cy="24" r="5" fill="#facc15" />
    <circle cx="63" cy="24" r="5" fill="#34d399" />
    <text x="87" y="29" fill="#7c879b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">fouad@linux</text>

    <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="14">
      <text x="24" y="82" fill="#22d3ee">$</text>
      <text x="42" y="82" fill="#e2e8f0">build something useful</text>
      <text x="24" y="116" fill="#64748b">› privacy</text>
      <text x="125" y="116" fill="#34d399">local-first</text>
      <text x="24" y="146" fill="#64748b">› platform</text>
      <text x="125" y="146" fill="#a78bfa">linux native</text>
      <text x="24" y="176" fill="#64748b">› status</text>
      <text x="125" y="176" fill="#22d3ee">shipping_</text>
    </g>
  </g>

  <path d="M742 0V320" stroke="url(#accent)" stroke-opacity=".09" />
</svg>
